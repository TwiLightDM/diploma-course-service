syntax = "proto3";

package courseservice;

option go_package = "proto/courseservicepb";

service CourseService {
  rpc CreateCourse(CreateCourseRequest) returns (CreateCourseResponse);
  rpc ReadCourse(ReadCourseRequest) returns (ReadCourseResponse);
  rpc ReadAllCoursesByOwnerId(ReadAllCoursesByOwnerIdRequest) returns (ReadAllCoursesByOwnerIdResponse);
  rpc ReadAllCourses(ReadAllCoursesRequest) returns (ReadAllCoursesResponse);
  rpc ReadAllAvailableCourses(ReadAllAvailableCoursesRequest) returns (ReadAllAvailableCoursesResponse);
  rpc UpdateCourse(UpdateCourseRequest) returns (UpdateCourseResponse);
  rpc UpdatePublishedAt(UpdatePublishedAtRequest) returns (UpdateCourseResponse);
  rpc DeleteCourse(DeleteCourseRequest) returns (DeleteCourseResponse);
}

message Course {
  string id = 1;
  string title = 2;
  string description = 3;
  string access_type = 4;
  string published_at = 5;
  string owner_id = 6;
  int64 amount_of_modules = 7;
  int64 amount_of_lessons = 8;
}

message CreateCourseRequest {
  string title = 1;
  string description = 2;
  string access_type = 3;
  string owner_id = 4;
}

message CreateCourseResponse {
  Course course = 1;
}

message ReadCourseRequest {
  string id = 1;
}

message ReadCourseResponse {
  Course course = 1;
}

message ReadAllCoursesByOwnerIdRequest {
  string owner_id = 1;
}

message ReadAllCoursesByOwnerIdResponse {
  repeated Course courses = 1;
}

message ReadAllCoursesRequest {
}

message ReadAllCoursesResponse {
  repeated Course courses = 1;
}

message ReadAllAvailableCoursesRequest {
  string user_id = 1;
}

message ReadAllAvailableCoursesResponse {
  repeated Course courses = 1;
}

message UpdateCourseRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  string access_type = 4;
}

message UpdatePublishedAtRequest{
  string id = 1;
}

message UpdateCourseResponse {
  Course course = 1;
}

message DeleteCourseRequest {
  string id = 1;
}

message DeleteCourseResponse {
}
